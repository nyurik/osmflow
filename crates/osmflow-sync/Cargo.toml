[package]
name = "osmflow-sync"
version = "0.14.1"
description = "Imports OpenStreetMap PBF files into PostgreSQL and keeps them current from replication diffs"
authors.workspace = true
# The crate's own directory, ending in `/`: Dependabot then shows this crate's CHANGELOG.md in its PRs
repository = "https://github.com/nyurik/osmflow/tree/main/crates/osmflow-sync/"
edition.workspace = true
license.workspace = true
keywords = ["osm", "openstreetmap", "postgres", "postgis", "replication"]
categories = ["science::geo", "database"]
readme = "README.md"
rust-version.workspace = true

[features]
# `Stop::on_signals`: Ctrl+C, SIGTERM and SIGHUP asking an update to stop
signals = ["dep:ctrlc"]
# TLS for database connections, as the connection string's `sslmode` and `sslrootcert` ask; without it, connections
# are not encrypted
tls = [
    "dep:percent-encoding",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:tokio-postgres-rustls",
]

[dependencies]
crossbeam-channel.workspace = true
ctrlc = { workspace = true, optional = true }
geo-traits.workspace = true
osmflow = { workspace = true, features = ["nodes", "osc", "pbf"] }
percent-encoding = { workspace = true, optional = true }
postgres.workspace = true
rayon.workspace = true
redb.workspace = true
rustls = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
strum.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio-postgres-rustls = { workspace = true, optional = true }
tracing.workspace = true
twkb.workspace = true
wkb.workspace = true

[dev-dependencies]
postgres.workspace = true

[lints]
workspace = true
